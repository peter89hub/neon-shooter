<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Space Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* 모바일에서 스크롤 방지 */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-text {
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        .btn {
            background: linear-gradient(45deg, #00f260, #0575e6);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 96, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 96, 0.6);
        }
        .hidden {
            display: none !important;
        }
        /* 모바일용 컨트롤 안내 */
        .mobile-hint {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 게임 캔버스 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 레이어 -->
    <div id="ui-layer">
        <div class="flex justify-between w-full max-w-4xl mx-auto">
            <div class="hud-text" style="color: #00ffff;">SCORE: <span id="scoreEl">0</span></div>
            <div class="hud-text" style="color: #ff0055;">HP: <span id="hpEl">100</span>%</div>
        </div>
    </div>

    <!-- 시작 화면 -->
    <div id="start-screen">
        <h1 class="text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 filter drop-shadow-lg">
            NEON SHOOTER
        </h1>
        <p class="text-gray-300 mb-8 text-center max-w-md px-4">
            적들을 파괴하고 살아남으세요.<br>
            <span class="text-sm text-gray-500 mt-2 block">PC: 방향키 이동 / 스페이스바 발사</span>
            <span class="text-sm text-gray-500 block">모바일: 터치 드래그 이동 / 자동 발사</span>
        </p>
        <button class="btn" id="startBtn">임무 시작</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="game-over-screen" class="hidden">
        <h2 class="text-5xl font-black text-red-500 mb-2 drop-shadow-lg">MISSION FAILED</h2>
        <p class="text-2xl text-white mb-6">최종 점수: <span id="finalScore">0</span></p>
        <button class="btn" id="restartBtn">재시작</button>
    </div>

    <script>
        /**
         * 게임 설정 및 상태 관리
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI 요소
        const scoreEl = document.getElementById('scoreEl');
        const hpEl = document.getElementById('hpEl');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // 게임 상태 변수
        let animationId;
        let score = 0;
        let gameActive = false;
        let frames = 0;
        let isMobile = false;

        // 캔버스 크기 조정
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            isMobile = canvas.width < 768;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * 클래스 정의: 플레이어, 발사체, 적, 입자(이펙트), 배경별
         */

        class Player {
            constructor() {
                this.width = 40;
                this.height = 50; // 조금 더 날렵하게
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.velocity = { x: 0, y: 0 };
                this.speed = 7;
                this.color = '#00ffff';
                this.hp = 100;
                this.radius = 20; // 충돌 감지용
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // 기체 디자인 (전투기 모양)
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(0, this.height / 3); // 엔진 부분 안쪽으로 파임
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                
                // 네온 효과
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = this.color;
                ctx.fill();

                // 콕핏
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(0, -5, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }

            update() {
                this.draw();
                
                // 경계선 체크
                if (this.x - this.width/2 < 0) this.x = this.width/2;
                if (this.x + this.width/2 > canvas.width) this.x = canvas.width - this.width/2;
                if (this.y - this.height/2 < 0) this.y = this.height/2;
                if (this.y + this.height/2 > canvas.height) this.y = canvas.height - this.height/2;

                // 이동 적용
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        class Projectile {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.velocity = { x: 0, y: -12 }; // 빠른 속도
                this.radius = 4;
                this.color = '#ffcc00';
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // 성능을 위해 리셋
            }

            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 0: 기본, 1: 빠름, 2: 튼튼함
                
                // 타입별 속성 설정
                if (this.type === 1) { // 스피드형
                    this.width = 30;
                    this.height = 30;
                    this.velocity = { x: 0, y: 5 };
                    this.color = '#ff0055';
                    this.hp = 1;
                    this.scoreValue = 20;
                } else if (this.type === 2) { // 탱커형
                    this.width = 60;
                    this.height = 60;
                    this.velocity = { x: 0, y: 1.5 };
                    this.color = '#be2edd';
                    this.hp = 3;
                    this.scoreValue = 50;
                } else { // 기본형
                    this.width = 40;
                    this.height = 40;
                    this.velocity = { x: 0, y: 3 };
                    this.color = '#ff4d4d';
                    this.hp = 1;
                    this.scoreValue = 10;
                }
                
                this.radius = this.width / 2;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.beginPath();
                if (this.type === 2) {
                    // 육각형
                    for (let i = 0; i < 6; i++) {
                        ctx.lineTo(this.width/2 * Math.cos(i * Math.PI / 3), this.width/2 * Math.sin(i * Math.PI / 3));
                    }
                } else {
                    // 마름모 (적)
                    ctx.moveTo(0, this.height/2);
                    ctx.lineTo(this.width/2, 0);
                    ctx.lineTo(0, -this.height/2);
                    ctx.lineTo(-this.width/2, 0);
                }
                ctx.closePath();

                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // HP 표시 (1 이상일 때만)
                if (this.hp > 1) {
                    ctx.fillStyle = 'white';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.shadowBlur = 0;
                    ctx.fillText(this.hp, 0, 5);
                }

                ctx.restore();
            }

            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.velocity = {
                    x: (Math.random() - 0.5) * 6,
                    y: (Math.random() - 0.5) * 6
                };
                this.radius = Math.random() * 3;
                this.color = color;
                this.alpha = 1;
                this.friction = 0.96; // 감속
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.draw();
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02; // 페이드 아웃
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 1.5;
                this.velocity = { x: 0, y: Math.random() * 2 + 0.5 }; // 원근감
                this.alpha = Math.random();
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.draw();
                this.y += this.velocity.y;
                // 화면 아래로 나가면 위로 재배치
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
        }

        /**
         * 게임 로직 및 제어
         */
        
        let player = new Player();
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let keys = {
            ArrowRight: false,
            ArrowLeft: false,
            ArrowUp: false,
            ArrowDown: false,
            Space: false
        };

        // 배경 별 초기화
        for (let i = 0; i < 70; i++) {
            stars.push(new Star());
        }

        function init() {
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            frames = 0;
            scoreEl.innerHTML = score;
            hpEl.innerHTML = player.hp;
            gameActive = true;
        }

        function spawnEnemies() {
            // 60프레임(약 1초)마다 적 생성, 점수가 높을수록 더 자주 생성
            const spawnRate = Math.max(30, 60 - Math.floor(score / 500));
            
            if (frames % spawnRate === 0) {
                const radius = 30;
                let x = Math.random() * (canvas.width - radius * 2) + radius;
                let y = -100;
                
                // 적 타입 확률
                let type = 0;
                const rand = Math.random();
                if (score > 500 && rand < 0.2) type = 2; // 탱커
                else if (score > 200 && rand < 0.4) type = 1; // 스피드
                
                enemies.push(new Enemy(x, y, type));
            }
        }

        function animate() {
            if (!gameActive) return;
            animationId = requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // 잔상 효과
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 배경 별 업데이트
            stars.forEach(star => star.update());

            // 플레이어 제어 (PC)
            if (keys.ArrowRight && player.x < canvas.width - player.width/2) player.velocity.x = player.speed;
            else if (keys.ArrowLeft && player.x > player.width/2) player.velocity.x = -player.speed;
            else player.velocity.x = 0;

            if (keys.ArrowUp && player.y > player.height/2) player.velocity.y = -player.speed;
            else if (keys.ArrowDown && player.y < canvas.height - player.height/2) player.velocity.y = player.speed;
            else player.velocity.y = 0;

            player.update();

            // 입자(폭발) 업데이트
            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                }
            });

            // 발사체 업데이트
            projectiles.forEach((projectile, index) => {
                projectile.update();

                // 화면 밖 제거
                if (projectile.y + projectile.radius < 0) {
                    setTimeout(() => {
                        projectiles.splice(index, 1);
                    }, 0);
                }
            });

            // 적 업데이트 및 충돌 처리
            enemies.forEach((enemy, index) => {
                enemy.update();

                // 플레이어와 적 충돌
                const distPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (distPlayer - enemy.radius - player.radius < 1) {
                    // 충돌 이펙트
                    for (let i = 0; i < 15; i++) {
                        particles.push(new Particle(player.x, player.y, player.color));
                        particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                    }
                    
                    enemies.splice(index, 1);
                    player.hp -= 34; // 3번 맞으면 사망
                    if(player.hp < 0) player.hp = 0;
                    hpEl.innerHTML = Math.floor(player.hp);

                    if (player.hp <= 0) {
                        endGame();
                    }
                }

                // 총알과 적 충돌
                projectiles.forEach((projectile, pIndex) => {
                    const dist = Math.hypot(projectile.x - enemy.x, projectile.y - enemy.y);

                    // 충돌 발생
                    if (dist - enemy.radius - projectile.radius < 1) {
                        // 폭발 이펙트 (작은 폭발)
                        for (let i = 0; i < 4; i++) {
                            particles.push(new Particle(projectile.x, projectile.y, enemy.color));
                        }

                        // 적 피격 처리
                        enemy.hp--;
                        
                        // 총알 제거
                        setTimeout(() => projectiles.splice(pIndex, 1), 0);

                        if (enemy.hp <= 0) {
                            // 큰 폭발
                            for (let i = 0; i < 10; i++) {
                                particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                            }
                            
                            // 점수 증가
                            score += enemy.scoreValue;
                            scoreEl.innerHTML = score;

                            setTimeout(() => {
                                enemies.splice(index, 1);
                            }, 0);
                        }
                    }
                });

                // 화면 아래로 나가면 게임 오버(혹은 점수 깎임) - 여기선 그냥 제거하고 플레이어 데미지
                if (enemy.y > canvas.height + 100) {
                    enemies.splice(index, 1);
                    player.hp -= 10; // 놓치면 데미지 조금
                    if(player.hp < 0) player.hp = 0;
                    hpEl.innerHTML = Math.floor(player.hp);
                    if (player.hp <= 0) endGame();
                }
            });

            spawnEnemies();
            frames++;
        }

        // 발사 로직
        function shoot() {
            projectiles.push(new Projectile(player.x, player.y - 20));
        }

        // 게임 오버 처리
        function endGame() {
            gameActive = false;
            cancelAnimationFrame(animationId);
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        // 이벤트 리스너 설정
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                 if (gameActive) shoot();
                 keys.Space = true;
            }
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') keys.Space = false;
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        // 모바일 터치 컨트롤
        let touchX = 0;
        let touchY = 0;
        let firingInterval;

        window.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
            
            // 모바일은 자동 발사
            if (!firingInterval) {
                firingInterval = setInterval(shoot, 200); // 0.2초마다 발사
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (!gameActive) return;
            e.preventDefault(); // 스크롤 방지
            const tX = e.touches[0].clientX;
            const tY = e.touches[0].clientY;

            // 터치 위치를 따라가되 부드럽게 (Lerp 대신 직접 대입으로 반응성 향상)
            player.x = tX;
            player.y = tY - 50; // 손가락 살짝 위
        }, { passive: false });

        window.addEventListener('touchend', () => {
            clearInterval(firingInterval);
            firingInterval = null;
        });

        // 버튼 이벤트
        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            init();
            animate();
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            init();
            animate();
        });

    </script>
</body>

    
</html>
